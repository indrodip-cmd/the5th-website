<!doctype html><html><head><meta charset="utf-8"><title>Expertise to Income, cover</title>
<style>
/* 600 x 900 CSS px; rendered at 2x. Funnel tokens: near-black #070A06, acid lime #C9FF48.
   Display serif echoes the headings in The5th AI dashboard; the "5" tile is its logo mark. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:600px;height:900px;background:#070A06;overflow:hidden}
.cover{position:relative;width:600px;height:900px;overflow:hidden;color:#F2F6EC;font-family:'Inter',sans-serif;
  background:
   radial-gradient(90% 55% at 50% 108%, rgba(201,255,72,.24) 0%, rgba(201,255,72,0) 62%),
   radial-gradient(70% 38% at 12% -4%, rgba(201,255,72,.10) 0%, rgba(201,255,72,0) 70%),
   linear-gradient(180deg,#0B0F08 0%,#070A06 100%)}
.spine{position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0) 100%);border-right:1px solid rgba(255,255,255,.06)}
.frame{position:absolute;inset:26px 26px 26px 38px;border:1px solid rgba(201,255,72,.34);border-radius:4px}
.frame::after{content:'';position:absolute;inset:6px;border:1px solid rgba(201,255,72,.12);border-radius:2px}
.brand{position:absolute;top:58px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.tile{width:44px;height:44px;border-radius:12px;background:#1C4A32;border:1px solid rgba(201,255,72,.45);display:flex;align-items:center;justify-content:center;
  font:700 27px/1 'Bitstream Charter','Liberation Serif',serif;color:#fff}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:#C9FF48;padding-left:.34em}
.title{position:absolute;top:168px;left:0;right:0;text-align:center;font-family:'Bitstream Charter','Liberation Serif',serif}
.t1{font-size:104px;line-height:.98;font-weight:700;letter-spacing:-.025em;color:#F2F6EC}
.to{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 -2px;font-size:30px;font-style:italic;color:#C9FF48}
.to i{display:block;width:70px;height:1px;background:rgba(201,255,72,.55)}
.t2{font-size:118px;line-height:.98;font-weight:700;letter-spacing:-.03em;color:#C9FF48;text-shadow:0 0 42px rgba(201,255,72,.28)}
.tag{position:absolute;top:470px;left:60px;right:52px;text-align:center}
.tag b{display:block;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.005em;color:#F2F6EC}
.tag span{display:block;margin-top:12px;font-size:13px;line-height:1.5;color:#9AA79A}
.steps{position:absolute;left:38px;right:26px;top:610px;height:150px;overflow:visible}
.chips{position:absolute;left:68px;right:56px;top:786px;text-align:center;border:1px solid rgba(201,255,72,.4);border-radius:3px;padding:10px 6px;
  font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#C9FF48}
.auth{position:absolute;left:0;right:0;bottom:50px;text-align:center;font-size:11.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#F2F6EC;padding-left:.3em}
</style></head><body>
<div class="cover">
  <div class="spine"></div><div class="frame"></div>
  <div class="brand"><div class="tile">5</div><div class="eyebrow">The5th Global Consulting</div></div>
  <div class="title"><div class="t1">Expertise</div><div class="to"><i></i>to<i></i></div><div class="t2">Income</div></div>
  <div class="tag"><b>Stop Selling Your Time.<br>Start Building an Asset.</b><span>Your complete guide to building a digital product business.</span></div>
  <svg class="steps" viewBox="0 0 536 130" preserveAspectRatio="none" overflow="visible" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#C9FF48" stop-opacity=".08"/><stop offset="1" stop-color="#C9FF48" stop-opacity=".95"/></linearGradient>
      <radialGradient id="o" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C9FF48" stop-opacity=".95"/><stop offset=".35" stop-color="#C9FF48" stop-opacity=".35"/><stop offset="1" stop-color="#C9FF48" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="430" cy="22" r="58" fill="url(#o)"/>
    <g fill="url(#g)">
      <rect x="40"  y="104" width="62" height="26" rx="3"/>
      <rect x="116" y="84"  width="62" height="46" rx="3"/>
      <rect x="192" y="64"  width="62" height="66" rx="3"/>
      <rect x="268" y="44"  width="62" height="86" rx="3"/>
      <rect x="344" y="26"  width="62" height="104" rx="3"/>
      <rect x="420" y="8"   width="62" height="122" rx="3"/>
    </g>
    <path d="M40 104 L482 8" stroke="#C9FF48" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round" opacity=".7"/>
    <circle cx="482" cy="8" r="5" fill="#C9FF48"/>
  </svg>
  <div class="chips">9 Chapters &nbsp;·&nbsp; Complete Frameworks &nbsp;·&nbsp; Every Worksheet</div>
  <div class="auth">Indrodip Ghosh &amp; Christinee Mathison</div>
</div></body></html>
